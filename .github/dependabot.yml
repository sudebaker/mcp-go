version: 2

# Las actions van fijadas a version exacta y las imagenes base del Dockerfile a
# tag de minor (ej. golang:1.27-alpine, no :alpine). Las versiones concretas
# viven solo en deployments/Dockerfile; este comentario no las repite para que no
# se quede atras en cada bump. Dependabot abre el PR del bump; el CI es el que
# decide si entra.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /deployments
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
