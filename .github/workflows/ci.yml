name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, build, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: go test -race (config, transport, tests)
        run: go test -race -count=1 ./internal/config/ ./internal/transport/ ./tests/

  python:
    name: Python — tests de seguridad y de herramientas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Dependencias de los tests (fijadas)
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 PyYAML==6.0.3 Jinja2==3.1.6
      # Mitigaciones SSRF, SSTI, ReDoS y deserialización YAML.
      #
      # Los tests de herramienta (`tools/*/test_*.py`) se recogen por glob, no por lista
      # fija: así un test nuevo queda cableado en el mismo commit que lo trae, sin que
      # nadie tenga que acordarse de añadirlo aquí — que es justo cómo se cuelan los
      # verdes sin ancla. Si un tool test no puede correr en este job, declara su
      # `skipif` con el motivo; no se queda fuera de la colección.
      - name: pytest (seguridad + tests de herramientas)
        run: |
          files="tests/test_security_mitigations.py"
          for f in tools/*/test_*.py; do
            if [ -e "$f" ]; then files="$files $f"; fi
          done
          echo "pytest $files"
          python -m pytest $files -v

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # Conjunto de linters y formatters en .golangci.yml (gofmt incluido).
      # Los linters desactivados hoy están listados ahí con su recuento.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  compose:
    name: Compose — defaults seguros y override por env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render con los defaults (ningún override)
        working-directory: deployments
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile ocu-investigacion \
            config --format json > /tmp/render-default.json
          python3 scripts/check-publish-hosts.py 127.0.0.1 < /tmp/render-default.json
      - name: Render con <SVC>_PUBLISH_HOST=0.0.0.0 (override LAN)
        working-directory: deployments
        env:
          MCP_PUBLISH_HOST: 0.0.0.0
          RUSTFS_PUBLISH_HOST: 0.0.0.0
          MEMGRAPH_PUBLISH_HOST: 0.0.0.0
          OPENSEARCH_PUBLISH_HOST: 0.0.0.0
          CRAWL4AI_PUBLISH_HOST: 0.0.0.0
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile ocu-investigacion \
            config --format json > /tmp/render-lan.json
          python3 scripts/check-publish-hosts.py 0.0.0.0 < /tmp/render-lan.json

  # El sandbox de data_analysis es un Dockerfile aparte: el job de imagen no lo
  # construye y sus pins (pandas, numpy, xlrd...) no los ve nadie hasta que un
  # tool falla en runtime. Mismo camino que tools/common/sandbox.py: código en
  # base64, usuario nobody, rootfs read-only. El código no lleva `import`: el
  # bootstrap solo expone módulos pre-inyectados (pd, np, json, ...).
  sandbox:
    name: Sandbox — build y ejecución (data_analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        run: docker build -f tools/data_analysis/sandbox.Dockerfile -t mcp-python-sandbox:latest .
      - name: Ejecución — análisis pandas como nobody, rootfs read-only
        run: |
          set -euo pipefail
          code=$(printf '%s' 'df = pd.DataFrame({"region": ["e", "n", "s"], "total": [40.0, 10.0, 50.5]}); print(df.groupby("region")["total"].sum().sort_index().to_string())' | base64 -w0)
          out=$(docker run --rm --network none --read-only --user nobody \
            --tmpfs /tmp:size=64M,mode=1777 \
            -e MPLCONFIGDIR=/tmp/matplotlib \
            -e MCP_SANDBOX_CODE="$code" \
            mcp-python-sandbox:latest python3 /sandbox/sandbox_bootstrap.py)
          echo "$out"
          grep -q '"success": true' <<<"$out"

  image:
    name: Imagen — build y escaneo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build (sin push)
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deployments/Dockerfile
          push: false
          load: true
          tags: mcp-go:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Verde en pip install no prueba que las dependencias IMPORTEN en 3.14
      # (ruedas cp314, libmagic1 para python-magic, torch CPU). Sin este paso
      # la imagen puede romperse en el primer tool que use pandas/cv2/weasyprint.
      # --entrypoint python: el entrypoint es /app/mcp-server, un `run` normal
      # arrancaría el servidor en vez de ejecutar el intérprete.
      - name: Arranque del intérprete — imports críticos
        run: |
          docker run --rm --entrypoint python mcp-go:ci -c "
          import sys, pandas, numpy, cv2, torch, weasyprint, magic
          print('python', sys.version.split()[0], '| pandas', pandas.__version__,
                '| numpy', numpy.__version__, '| cv2', cv2.__version__,
                '| torch', torch.__version__, '| weasyprint', weasyprint.__version__,
                '| magic ok')
          "
      # Puerta: ningún CRITICAL. Es la convención de la casa.
      - name: Trivy — CRITICAL (bloqueante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-go:ci
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
      # Informe de HIGH: hoy salen dependencias vendorizadas de pip en la imagen
      # base (jaraco.context, wheel, urllib3) y subir pip no las quita — rotan.
      # Se reportan para verlas evolucionar, sin bloquear el merge.
      - name: Trivy — HIGH (informativo)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-go:ci
          format: table
          severity: HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"
