# MCP Orchestrator Stack — Stack completo unificado
# Includes: MCP Server, PostgreSQL, SearXNG, Crawl4ai, Whisper, RustFS
#           OCu Investigación: Memgraph, OpenSearch
#
# SEGURIDAD DE REDES:
#   mcp-internal  — Red aislada (internal: true). Servicios de datos sin acceso a internet.
#   mcp-external  — Red con acceso a internet. Servicios públicos/proxy.
#   mcp-server es el único puente entre ambas.
#
# RED DE ESCUCHA Y EXPOSICIÓN (convención de dos variables, ver deployments/.env.example):
#   <SVC>_BIND_HOST    — red en la que ESCUCHA el proceso DENTRO del contenedor.
#                        Por defecto 0.0.0.0: si escuchara en loopback, el puerto no
#                        sería alcanzable ni por otros contenedores ni por `ports`.
#                        Bajarlo a 127.0.0.1 aísla el servicio al propio contenedor.
#   <SVC>_PUBLISH_HOST — red del HOST a la que se PUBLICA el puerto (`ports`).
#                        Por defecto 127.0.0.1 (seguro). Poner 0.0.0.0 para exponerlo
#                        en la LAN — solo con firewall/auth por delante.
#
# Variables de entorno en deployments/.env (ver .env.example)

services:

  # ═══════════════════════════════════════════════
  # MCP SERVER — Único punto de entrada, puente entre redes
  # ═══════════════════════════════════════════════
  mcp-server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: mcp-orchestrator
    ports:
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:8080:8080"
    environment:
      # Bind interno del proceso. Debe ser 0.0.0.0 dentro del contenedor, si no ni
      # los demás contenedores ni el mapeo de `ports` alcanzan el servidor.
      MCP_BIND_HOST: ${MCP_BIND_HOST:-0.0.0.0}
      BASE_URL: ${BASE_URL:?BASE_URL is required (copy deployments/.env.example to .env)}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      LLM_API_URL: ${LLM_API_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      LLM_VISION_API_URL: ${LLM_VISION_API_URL}
      # DATABASE_URL se construye aqui desde POSTGRES_*: una sola fuente de verdad
      # para el password (antes era un literal duplicado en .env que podia
      # desincronizarse). El host `postgres` es el nombre del servicio interno.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Cache de modelos: horneado en la imagen en /app/.cache/fastembed (ver
      # deployments/Dockerfile) y propiedad de uid 10001. El default apunta ahi:
      # apuntarlo a un volumen da PermissionError y fastembed falla con
      # "Could not load model ... from any source" si el volumen no es de 10001.
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/app/.cache/fastembed}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_TOKEN: ${CRAWL4AI_TOKEN:?CRAWL4AI_TOKEN is required - generate with openssl rand -hex 32}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000}
      SSRF_ALLOWLIST: ${SSRF_ALLOWLIST:-rustfs}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-ollama}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-rustfs:9000}
      RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:?RUSTFS_PUBLIC_URL is required (presigned download URLs)}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY is required}
      # S3_BUCKET_NAME: no se usa, cada tool hardcodea su bucket
      # S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      DOWNLOAD_URL_EXPIRY_HOURS: ${DOWNLOAD_URL_EXPIRY_HOURS:-24}
      MCP_UPLOAD_API_KEY: ${MCP_UPLOAD_API_KEY:?MCP_UPLOAD_API_KEY is required}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      # Presupuesto de memoria del runtime Go. GOMEMLIMIT es un limite BLANDO: el GC
      # aprieta para no pasarlo, en vez de dejar que el cgroup alcance memory.max y
      # actue el OOM killer. Ojo: solo cuenta la memoria del runtime Go, NO la de los
      # subprocesos Python de las tools, que viven en el mismo cgroup.
      # Medido en produccion (2026-10-19, imagen 7f91291): heap Go vivo ~530 MB y RSS
      # del proceso mcp-server 1075 MB en reposo; un solo kb_search anade 619 MB de
      # Python => 1696 MB de los 2048 MB del cgroup (83 %) con UNA llamada. Dos tools
      # concurrentes no caben en 2G, de ahi el limite de 3G arriba: con GOMEMLIMIT en
      # 1536MiB el runtime se queda en ~1.6G de RSS como maximo y deja >1G a los hijos.
      GOMEMLIMIT: ${GOMEMLIMIT:-1536MiB}
      MEMGRAPH_URL: ${MEMGRAPH_URL:-bolt://memgraph:7687}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD}
      MCP_TOOLSET: ${MCP_TOOLSET:-default}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      # Auth del endpoint MCP: MCP_AUTH_MODE (required|off) es el unico interruptor.
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:?MCP_AUTH_MODE is required (required|off)}
      # Una var por entrada de configs/config.yaml -> auth.keys[].key_env.
      # El nombre de la var NO guarda relacion con el user_id: la invariante es
      # que cada key_env sea unico. Con una sola entrada basta MCP_AUTH_KEY; con
      # N, <CLIENT>_AUTH_KEY.
      MCP_AUTH_KEY: ${MCP_AUTH_KEY:?MCP_AUTH_KEY is required}
      # Sandbox de ejecución de código (tool data_analysis). Este contenedor NO
      # monta docker.sock, así que el daemon no existe dentro: la única vía sería
      # el fallback `exec()` restringido, que es evadible (cadena de subclases ->
      # `_wrap_close.__init__.__globals__['system']`). Por defecto `true`: sin
      # daemon, el tool responde SANDBOX_UNAVAILABLE en vez de ejecutar código
      # generado por el LLM en el proceso del orquestador (con DATABASE_URL,
      # MCP_AUTH_KEY y MCP_UPLOAD_API_KEY a mano).
      # `false` solo en desarrollo local, y a sabiendas de lo anterior.
      SANDBOX_REQUIRED: ${SANDBOX_REQUIRED:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - mcp-data:/data
    # memgraph y opensearch solo se levantan con --profile ocu-investigacion.
    # required: false evita que falle la validacion cuando no estan activados.
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      whisper:
        condition: service_started
      searxng:
        condition: service_healthy
      memgraph:
        condition: service_healthy
        required: false
      opensearch:
        condition: service_healthy
        required: false
    networks:
      - mcp-internal
      - mcp-external
    restart: unless-stopped
    healthcheck:
      # `-f` es obligatorio: sin el, curl devuelve 0 aunque /health responda 503 y el
      # contenedor se reporta "healthy" con el servidor sin poder servir. Verificado en
      # produccion el 2026-10-19: `curl -f` dentro del contenedor daba exit 22 (503) y
      # el Health.Log de Docker seguia anotando ExitCode 0 con este test sin `-f`.
      # Depende de #31 (checkMemory ya no devuelve unhealthy): hasta ese merge, /health
      # baja a 503 bajo carga y este test marcaria el contenedor en rojo.
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          # 3G, no 2G: medido con la imagen 7f91291 (2026-10-19) el RSS del proceso Go
          # en reposo es 1075 MB y un solo kb_search anade 619 MB de Python => 1696 MB
          # (83 % de 2G) con UNA llamada; dos tools concurrentes no cabian.
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "network.security=bridge"
      - "network.description=Puente entre red interna y externa"

  # ═══════════════════════════════════════════════
  # SERVICIOS INTERNOS — Sin acceso a internet (mcp-internal)
  # ═══════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcp-internal
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "network.security=internal"
      - "network.description=Base de datos vectorial (KB)"

  # ─── whisper ───
  # El servicio `whisper` vive SOLO en mcp-internal (internal: true): no tiene
  # salida a internet. Si el volumen `whisper-models` está vacío, faster-whisper
  # no puede bajar el modelo y el loader de huggingface_hub pasa a modo offline:
  # HTTP 500 con
  #   LocalEntryNotFoundError: Cannot find an appropriate cached snapshot folder
  #   ... and outgoing traffic has been disabled
  # (medido por QA en el contenedor de epicteto el 2026-10-20). No era un bug del
  # server: era el aislamiento de red + caché vacía.
  #
  # Diseño: un servicio de UN SOLO USO (`whisper-model-fetch`), en mcp-external,
  # baja el modelo al volumen compartido; `whisper` espera a que termine con
  # éxito y arranca en offline explícito (`HF_HUB_OFFLINE=1`) leyendo de ese
  # volumen. Así whisper sigue sin poder salir a internet y el modelo solo se
  # descarga una vez (las siguientes subidas solo validan, ~2 s).
  whisper-model-fetch:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-model-fetch
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
      # Descarga permitida SOLO aquí.
      HF_HUB_OFFLINE: "0"
      WHISPER_MODEL_ID: ${WHISPER_MODEL_ID:-Systran/faster-whisper-small}
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - mcp-external
    entrypoint: ["/root/faster-whisper-server/.venv/bin/python"]
    command:
      - "-c"
      - |
        import os
        from huggingface_hub import snapshot_download
        repo = os.environ["WHISPER_MODEL_ID"]
        print(f"whisper: bajando {repo} a {os.environ['HF_HOME']}", flush=True)
        print(f"whisper: modelo disponible en {snapshot_download(repo_id=repo)}", flush=True)
    # Un solo uso. Si falla (HF caído), `up -d` falla y whisper no arranca: es el
    # comportamiento que queremos, un whisper sin modelo responde 500 en silencio.
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          # 2G: descarga ~484 MB en streaming; con menos margen un OOM aquí deja
          # whisper sin modelo. Medido: pico de RSS bajo, pero no se aprieta.
          memory: 2G
    labels:
      - "network.security=external"
      - "network.description=Descarga única del modelo de whisper (no sirve tráfico)"

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    environment:
      # La config del server es pydantic con env_nested_delimiter="__": el modelo y
      # la device se fijan con DOBLE barra baja. `WHISPER_MODEL=...` (una sola) se
      # ignoraba en silencio y el server corría con los defaults de la imagen.
      WHISPER__MODEL: ${WHISPER_MODEL_ID:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
      # Offline a propósito: el modelo ya está en el volumen. Si falta, el error
      # sale inmediato y claro en vez de tras un timeout de red.
      HF_HUB_OFFLINE: "1"
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - mcp-internal
    depends_on:
      whisper-model-fetch:
        condition: service_completed_successfully
    command: ["/root/faster-whisper-server/.venv/bin/uvicorn", "--factory", "faster_whisper_server.main:create_app", "--host", "${WHISPER_BIND_HOST:-0.0.0.0}", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      # Liveness, NO prueba de modelo: /health responde 200 aunque el modelo no se
      # pueda cargar (la carga es perezosa, en la primera transcripción). El gate
      # real del modelo es una transcripción, ver RUNBOOK §7.
      # Sin curl en la imagen: se usa el python del venv.
      test: ["CMD", "/root/faster-whisper-server/.venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "network.security=internal"
      - "network.description=Transcripción de audio (Whisper)"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "${RUSTFS_PUBLISH_HOST:-127.0.0.1}:9000:9000"
    environment:
      # OJO con los nombres: la imagen de RustFS lee RUSTFS_ACCESS_KEY y
      # RUSTFS_SECRET_KEY; el cliente S3 del server Go y de los tools Python lee
      # RUSTFS_ACCESS_KEY_ID / RUSTFS_SECRET_ACCESS_KEY. Se traduce aqui para
      # que un unico par en .env sirva a los dos; si no, RustFS arranca con las
      # credenciales por defecto (rustfsadmin) y todo acceso S3 responde 401.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY is required}
    volumes:
      - rustfs-data:/data
    networks:
      - mcp-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/minio/health/live | grep -qE '^(200|403)$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      - "network.security=internal"
      - "network.description=Almacenamiento S3-compatible (evidencias)"

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: ocu-memgraph
    profiles:
      - ocu-investigacion
    restart: unless-stopped
    ports:
      - "${MEMGRAPH_PUBLISH_HOST:-127.0.0.1}:7687:7687"
    volumes:
      - ocu-memgraph-data:/var/lib/memgraph
      - ocu-memgraph-logs:/var/log/memgraph
      - ocu-memgraph-etc:/etc/memgraph
    environment:
      - MEMGRAPH_ORGANIZATION_NAME=OCu
      - MEMGRAPH_USERNAME=${MEMGRAPH_USERNAME}
    command:
      - "--bolt-port=7687"
      - "--log-level=TRACE"
      - "--also-log-to-stderr=true"
      - "--storage-properties-on-edges=true"
      - "--storage-snapshot-interval-sec=300"
      - "--storage-wal-enabled=true"
      - "--telemetry-enabled=false"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f memgraph || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mcp-internal
    labels:
      - "ocu.component=graph"
      - "network.security=internal"
      - "network.description=Base de grafos (relaciones de casos)"

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: ocu-opensearch
    profiles:
      - ocu-investigacion
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_PUBLISH_HOST:-127.0.0.1}:9200:9200"
      - "${OPENSEARCH_PUBLISH_HOST:-127.0.0.1}:9600:9600"
    volumes:
      - ocu-opensearch-data:/usr/share/opensearch/data
    environment:
      - cluster.name=ocu-cluster
      - node.name=ocu-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      # Bind interno del nodo. NO se puede bajar a 127.0.0.1: mcp-server lo alcanza
      # como `opensearch:9200` por la red del bridge, no por loopback.
      - network.host=${OPENSEARCH_BIND_HOST:-0.0.0.0}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mcp-internal
    labels:
      - "ocu.component=search"
      - "network.security=internal"
      - "network.description=Motor de búsqueda full-text (evidencias)"

  # ═══════════════════════════════════════════════
  # SERVICIOS EXTERNOS — Con acceso a internet (mcp-external)
  # ═══════════════════════════════════════════════

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "${CRAWL4AI_PUBLISH_HOST:-127.0.0.1}:11235:11235"
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:?CRAWL4AI_TOKEN is required - generate with openssl rand -hex 32}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - mcp-external
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "network.security=external"
      - "network.description=Crawl4ai — scraper LLM-friendly sin API key"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - BASE_URL=http://searxng:8080
      - INSTANCE_NAME=SearXNG-MCP
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - mcp-external
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      - "network.security=external"
      - "network.description=Meta-buscador privado (OSINT)"

# ═══════════════════════════════════════════════
# REDES DE SEGURIDAD
# ═══════════════════════════════════════════════
networks:
  mcp-internal:
    driver: bridge
    internal: true
    labels:
      - "network.security=internal"
      - "network.description=Red aislada sin acceso a internet. Servicios de datos."
  mcp-external:
    driver: bridge
    labels:
      - "network.security=external"
      - "network.description=Red con acceso a internet. Servicios públicos y proxy."

# ═══════════════════════════════════════════════
# VOLÚMENES PERSISTENTES
# ═══════════════════════════════════════════════
volumes:
  whisper-models:
    driver: local
  mcp-data:
    driver: local
  postgres-data:
    driver: local
  rustfs-data:
    driver: local
  ocu-memgraph-data:
    driver: local
  ocu-memgraph-logs:
    driver: local
  ocu-memgraph-etc:
    driver: local
  ocu-opensearch-data:
    driver: local
