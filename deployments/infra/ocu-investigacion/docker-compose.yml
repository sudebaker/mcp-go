# OCu — Stack de Investigación Criminal
# Memgraph (grafo + vector search) + OpenSearch (búsqueda textual)
# Red aislada, no interfiere con el stack principal de Hermes.

services:

  # ──────────────────────────────────────────────
  # MEMGRAPH — Base de grafos in-memory con vector search
  # Cypher-compatible, protocolo Bolt :7687, consola :3000
  # ──────────────────────────────────────────────
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: ocu-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"   # Bolt protocol (drivers Go, Python, etc.)
      - "3001:3000"   # Consola web (Memgraph Lab)
    volumes:
      - ocu-memgraph-data:/var/lib/memgraph
      - ocu-memgraph-logs:/var/log/memgraph
      - ocu-memgraph-etc:/etc/memgraph
    environment:
      - MEMGRAPH_ORGANIZATION_NAME=OCu
      - MEMGRAPH_USERNAME=ocu_admin
      # La contraseña se define en la primera inicialización vía Cypher
      # ALTER USER ocu_admin SET PASSWORD TO '...';
    command:
      - "--bolt-port=7687"
      - "--log-level=TRACE"
      - "--also-log-to-stderr=true"
      - "--storage-properties-on-edges=true"
      - "--storage-snapshot-interval-sec=300"
      - "--storage-wal-enabled=true"
      - "--telemetry-enabled=false"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f memgraph || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ocu-net
    labels:
      - "ocu.component=graph"
      - "ocu.description=Base de grafos con vector search HNSW"

  # ──────────────────────────────────────────────
  # OPENSEARCH — Buscador full-text + dashboards
  # API REST :9200, Dashboards :5601
  # ──────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: ocu-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"   # API REST
      - "9600:9600"   # Performance Analyzer
    volumes:
      - ocu-opensearch-data:/usr/share/opensearch/data
    environment:
      - cluster.name=ocu-cluster
      - node.name=ocu-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true   # Sin SSL/autenticación para entorno interno
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - network.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ocu-net
    labels:
      - "ocu.component=search"
      - "ocu.description=Buscador full-text y analíticas forenses"

  # ──────────────────────────────────────────────
  # OPENSEARCH DASHBOARDS — Interfaz visual
  # ──────────────────────────────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: ocu-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - ocu-net
    labels:
      - "ocu.component=dashboards"
      - "ocu.description=Interfaz visual para análisis forense"

  # ──────────────────────────────────────────────
  # MEMGRAPH LAB — Consola web para el grafo
  # (Alternativa ligera a opensearch-dashboards para el grafo)
  # ──────────────────────────────────────────────
  memgraph-lab:
    image: memgraph/lab:latest
    container_name: ocu-memgraph-lab
    restart: unless-stopped
    ports:
      - "3100:3000"
    depends_on:
      memgraph:
        condition: service_healthy
    networks:
      - ocu-net
    labels:
      - "ocu.component=graph-ui"
      - "ocu.description=Consola web para queries Cypher y visualización de grafos"

networks:
  ocu-net:
    name: ocu-investigacion-net
    driver: bridge
    labels:
      - "ocu.network=investigacion"
      - "ocu.description=Red aislada para el stack de investigación criminal"

volumes:
  ocu-memgraph-data:
    name: ocu-memgraph-data
  ocu-memgraph-logs:
    name: ocu-memgraph-logs
  ocu-memgraph-etc:
    name: ocu-memgraph-etc
  ocu-opensearch-data:
    name: ocu-opensearch-data