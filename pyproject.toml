[build-system]
requires = ["setuptools", "wheel"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

# Exclude files that are not ready for type checking yet
exclude = [
    "tools/test_stderr_logging/*",
]

[tool.pytest.ini_options]
# Varias herramientas declaran su test como tools/<tool>/test_main.py. Con el modo
# de importacion por defecto (prepend) pytest importa ambos como el modulo
# "test_main" y aborta la recoleccion con "import file mismatch", tumbando el job
# de Python entero. importlib los carga por ruta y cada uno conserva su nombre.
addopts = "--import-mode=importlib"
markers = [
    "integration: marks tests as integration (requires external services)",
]