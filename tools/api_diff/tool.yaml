name: "api_diff"
description: "Compara dos OpenAPI specs (JSON/YAML, local o URL) y detecta breaking changes: endpoints nuevos/eliminados, parametros, responses. 0 tokens LLM."
command: "python3"
args: ["main.py"]
timeout: "60s"
input_schema:
  type: object
  properties:
    file_uri_old:
      type: string
      format: resource-uri
      description: "URI del recurso de la spec antigua"
    file_uri_new:
      type: string
      format: resource-uri
      description: "URI del recurso de la spec nueva"
  required:
    - file_uri_old
    - file_uri_new
