name: batch_summarize
description: 'Resume múltiples documentos. Input: file_uris, summary_type (individual/master/both).
  Output: summaries + master summary opcional.'
command: python3
args:
- main.py
timeout: 300s
input_schema:
  type: object
  properties:
    file_uris:
      type: array
      description: Files to summarize (resource URIs)
      items:
        type: string
        format: resource-uri
      minItems: 1
    summary_type:
      type: string
      enum:
      - individual
      - master
      - both
      default: both
      description: Type of summary to generate
    focus:
      type: string
      description: Optional focus area for summaries
    max_length:
      type: integer
      default: 500
      description: Maximum length of summary in characters
  required:
  - file_uris
