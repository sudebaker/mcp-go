name: "config_auditor"
description: "Audita ficheros de configuracion (YAML, JSON, TOML, INI, .env) en busca de
  secretos hardcodeados, puertos peligrosos, debug mode, valores vacios e IPs hardcodeadas.
  Sin LLM. Acepta res:// (fichero subido) o URL http(s). Output: findings + security score (0-100)."
command: "python3"
args: ["main.py"]
timeout: "120s"
input_schema:
  type: object
  properties:
    __files__:
      type: array
      minItems: 1
      description: "Ficheros de configuracion a auditar ({url, name})"
      items:
        type: object
        properties:
          url:
            type: string
            format: resource-uri
            description: "res://<token> de un fichero subido o URL http(s)"
          name:
            type: string
            description: "Nombre con extension; decide el parser (yaml/json/toml/ini/env)"
    rules:
      type: array
      items:
        type: string
        enum: ["secrets", "empty_required", "dangerous_ports", "debug_mode", "hardcoded_ips"]
      description: "Reglas a aplicar (por defecto: todas)"
    severity_filter:
      type: string
      enum: ["all", "critical", "high", "medium"]
      default: "all"
      description: "Severidad minima reportada (high incluye critical); no altera el score"
  required:
    - __files__
