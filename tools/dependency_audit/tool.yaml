name: "dependency_audit"
description: "Auditoria de dependencias declaradas vs usadas en codigo. Detecta unused, missing, outdated y security advisories basicos."
command: "python3"
args: ["main.py"]
timeout: "120s"
input_schema:
  type: object
  properties:
    project_root:
      type: string
    checks:
      type: array
      items:
        type: string
        enum: ["unused", "missing", "outdated", "security"]
      default: ["unused", "missing"]
  required:
    - project_root
