name: document_classifier
description: 'Clasifica documentos (contrato, factura, informe, regulación, etc.).
  Detecta idioma auto. Input: __files__. Output: classification + confidence + keywords.'
command: python3
args:
- main.py
timeout: 180s
input_schema:
  type: object
  properties:
    __files__:
      type: array
      description: "Documents to classify as objects {url, name}. url: http(s) link, res://<token> or file:///data/... (file inside /data)."
      items:
        type: object
        properties:
          url:
            type: string
            format: resource-uri
          name:
            type: string
      minItems: 1
    categories:
      type: array
      items:
        type: string
      description: 'Custom categories (default: predefined list)'
    language:
      type: string
      enum:
      - auto
      - es
      - en
      default: auto
      description: Document language detection
  required:
  - __files__
