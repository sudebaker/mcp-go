name: document_classifier
description: 'Clasifica documentos (contrato, factura, informe, regulación, etc.).
  Detecta idioma auto. Input: file_uris. Output: classification + confidence + keywords.'
command: python3
args:
- main.py
timeout: 180s
input_schema:
  type: object
  properties:
    file_uris:
      type: array
      description: Documents to classify (resource URIs)
      items:
        type: string
        format: resource-uri
      minItems: 1
    categories:
      type: array
      items:
        type: string
      description: 'Custom categories (default: predefined list)'
    language:
      type: string
      enum:
      - auto
      - es
      - en
      default: auto
      description: Document language detection
  required:
  - file_uris
