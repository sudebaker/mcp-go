name: document_fingerprint
description: >
  Genera hash perceptual de imágenes (phash, dhash, whash) y compara dos imágenes
  para detectar similitud visual o manipulación. Retorna score 0-100 + hashes.
command: python3
args:
- main.py
timeout: 30s
input_schema:
  type: object
  properties:
    file_uri_1:
      type: string
      format: resource-uri
      description: "URI del recurso de la primera imagen"
    file_uri_2:
      type: string
      format: resource-uri
      description: "URI del recurso de la segunda imagen"
    method:
      type: string
      enum: [phash, dhash, whash, average_hash]
      default: phash
      description: "Algoritmo de hash perceptual"
  required:
  - file_uri_1
  - file_uri_2
