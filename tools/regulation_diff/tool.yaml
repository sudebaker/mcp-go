name: regulation_diff
description: 'Compara dos versiones de documentos/regulaciones. Input: file_uri_1 (old), file_uri_2 (new). Output: unified diff + análisis + change counts.'
command: python3
args:
- main.py
timeout: 180s
input_schema:
  type: object
  properties:
    file_uri_1:
      type: string
      format: resource-uri
      description: Old version of the document
    file_uri_2:
      type: string
      format: resource-uri
      description: New version of the document
    focus:
      type: string
      description: Optional focus area for analysis
    output_format:
      type: string
      enum:
      - markdown
      - structured
      default: markdown
      description: Output format for analysis
  required:
  - file_uri_1
  - file_uri_2
