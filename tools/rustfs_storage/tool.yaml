name: rustfs_storage
description: 'Operaciones en RustFS/S3: upload, download, list, search, delete, stat.'
command: python3
args:
- main.py
timeout: 60s
input_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
      - upload
      - download
      - list
      - search
      - delete
      - stat
      description: Operation to perform
    bucket:
      type: string
      default: default
      description: S3 bucket name
    key:
      type: string
      description: Object key (path) in the bucket
    content:
      type: string
      description: Base64-encoded content for upload operation
    prefix:
      type: string
      description: Prefix for list/search operations
    max_keys:
      type: integer
      default: 100
      description: Maximum number of items to return
    expiry:
      type: integer
      default: 3600
      description: URL expiry time in seconds for download
  required:
  - operation
