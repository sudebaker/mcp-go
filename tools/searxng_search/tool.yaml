name: searxng_search
description: Búsqueda web con SearXNG local privado. Sin API key, sin rastreo. Agrega
  Google, Bing, DDG y Wikipedia.
command: python3
args:
- main.py
timeout: 30s
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Search query
    count:
      type: integer
      default: 10
      description: Number of results (max 20, default 10)
    language:
      type: string
      default: es-ES
      description: Language/locale for results (e.g. es-ES, en-US)
    categories:
      type: string
      description: 'Comma-separated categories: general, news, images, science, it,
        map (default: general)'
    time_range:
      type: string
      enum:
      - day
      - week
      - month
      - year
      description: Filter results by time range (optional)
  required:
  - query
